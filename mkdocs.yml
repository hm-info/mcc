site_name: MCC Kullanım Rehberi
site_description: MCC arayüzü kullanan CNC makineleri için servis ve kullanım rehberleri
site_url: https://hm-info.github.io/mcc/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: tr
  features:
    - navigation.expand
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: blue-grey
      accent: blue-grey

nav:
  - Türkçe:
      - Başlangıç: index.md
      - Takımlar:
          - Takım devre dışı bırakma: tool_disable_tr.md
  - English:
      - Getting Started: home-en.md
      - Tools:
          - Disabling a tool: tool_disable_en.md

use_directory_urls: false

plugins:
  - search

markdown_extensions:
  - md_in_html
  - tables

hooks:
  - hooks/pdf_export.py
  - hooks/navigation.py

extra:
  alternate:
    - name: Türkçe
      link: index.html
      lang: tr
    - name: English
      link: home-en.html
      lang: en

extra_css:
  - stylesheets/guide.css
